name: Android APK

# Builds an installable, debug-signed Android APK for sideload testing.
# - Every push to main and every manual dispatch uploads the APK as a
#   downloadable workflow artifact (grab it from the run's Artifacts section).
# - On a published GitHub Release, the APK is attached to the release assets.
# The debug keystore is auto-generated by the Android Gradle plugin, so the
# APK installs on any device with "install unknown apps" enabled — no signing
# secrets required. (Play Store distribution still uses the signed AAB built by
# release.yml.)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: >-
          Optional absolute URL for the WebView to load (hosted mode). Set to a
          deployed site (e.g. https://agents.jorisjonkers.dev) to get an APK that
          runs the live web app with working cookie auth + APIs. Leave blank for a
          bundled APK (offline assets; backend calls need native-bearer + backend G2-G6).
        required: false
        default: ''
        type: string
  release:
    types: [published]

permissions:
  contents: write
  packages: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # When set (hosted mode), capacitor.config.ts points the native WebView at this
  # URL instead of the bundled assets, so the APK runs the live web app.
  CAP_SERVER_URL: ${{ github.event.inputs.server_url || 'https://jorisjonkers.dev' }}

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: services/agents-ui/package.json
      - name: Install app dependencies
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --no-frozen-lockfile
      - name: Build web app
        run: pnpm --filter @extratoast/agents-ui build
      - name: Add Android project
        working-directory: services/agents-ui
        run: npx cap add android
      - name: Sync Android project
        working-directory: services/agents-ui
        run: npx cap sync android
      - name: Opt out of forced edge-to-edge (status bar overlap)
        working-directory: services/agents-ui/android
        run: |
          # Android 15 (targetSdk 35) forces edge-to-edge, so the WebView draws
          # under the OS status bar and StatusBar.overlaysWebView=false is
          # ignored. Target SDK 34 (compile stays 35) so the status bar is its
          # own space and content starts below it — a native fix that needs no
          # change to the web content.
          sed -i -E 's/targetSdkVersion = 3[0-9]+/targetSdkVersion = 34/' variables.gradle || true
          echo "--- variables.gradle ---"; cat variables.gradle
      - name: Assemble debug APK
        working-directory: services/agents-ui/android
        run: ./gradlew assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp services/agents-ui/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-apk/jorisjonkers.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jorisjonkers-app-apk
          path: dist-apk/jorisjonkers.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist-apk/jorisjonkers.apk --clobber
