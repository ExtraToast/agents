name: Android APK

# Builds an installable, debug-signed Android APK for sideload testing.
# - Every push to main and every manual dispatch uploads the APK as a
#   downloadable workflow artifact (grab it from the run's Artifacts section).
# - On a published GitHub Release, the APK is attached to the release assets.
# The debug keystore is auto-generated by the Android Gradle plugin, so the
# APK installs on any device with "install unknown apps" enabled — no signing
# secrets required. (Play Store distribution still uses the signed AAB built by
# release.yml.)

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: services/agents-ui/package.json
      - name: Install app dependencies
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --no-frozen-lockfile
      - name: Build web app
        run: pnpm --filter @extratoast/agents-ui build
      - name: Add Android project
        working-directory: services/agents-ui
        run: npx cap add android
      - name: Sync Android project
        working-directory: services/agents-ui
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: services/agents-ui/android
        run: ./gradlew assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp services/agents-ui/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-apk/agents-app-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agents-app-android-apk
          path: dist-apk/agents-app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist-apk/agents-app-debug.apk --clobber
