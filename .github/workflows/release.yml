name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # agents-ui is pinned to arm64 Pi nodes in the deploy repo, so it
          # must ship an arm64 manifest; the JVM services run on amd64 only.
          - image: agents-api
            repository: ghcr.io/extratoast/agents/agents-api
            dockerfile: services/agents-api/Dockerfile
            platforms: linux/amd64
          - image: agents-ui
            repository: ghcr.io/extratoast/agents/agents-ui
            dockerfile: services/agents-ui/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: agent-gateway
            repository: ghcr.io/extratoast/agents/agent-gateway
            dockerfile: services/agent-gateway/Dockerfile
            platforms: linux/amd64
          - image: agent-runner
            repository: ghcr.io/extratoast/agents/agent-runner
            dockerfile: services/agent-runner/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ matrix.repository }}:${{ needs.release-please.outputs.tag_name }}
            ${{ matrix.repository }}:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
            github_actor=${{ github.actor }}
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GIT_SHA=${{ needs.release-please.outputs.tag_name }}
