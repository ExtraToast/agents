name: Release

on:
  push:
    branches: [main]
  # Escape hatch: publish :latest from current main without waiting on a
  # release-please release (whose bot PR is workflow-approval gated).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # release-please PRs opened with the default GITHUB_TOKEN do not
      # trigger any CI (GitHub's recursion guard), so required status checks
      # never run and branch protection blocks the merge until a maintainer
      # manually approves the run. Authoring the PR with a GitHub App token
      # makes CI run automatically; the app is a recognised write
      # collaborator, so the first-time-contributor approval gate stays in
      # place for real outside contributors. The step is best-effort: if the
      # RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY secrets are not yet present
      # the token falls back to GITHUB_TOKEN and the workflow still runs.
      - uses: actions/create-github-app-token@v2
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # agents-ui is pinned to arm64 Pi nodes in the deploy repo, so it
          # must ship an arm64 manifest; the JVM services run on amd64 only.
          - image: agents-api
            repository: ghcr.io/extratoast/agents/agents-api
            dockerfile: services/agents-api/Dockerfile
            platforms: linux/amd64
          - image: agents-ui
            repository: ghcr.io/extratoast/agents/agents-ui
            dockerfile: services/agents-ui/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: agent-gateway
            repository: ghcr.io/extratoast/agents/agent-gateway
            dockerfile: services/agent-gateway/Dockerfile
            platforms: linux/amd64
          - image: agent-runner
            repository: ghcr.io/extratoast/agents/agent-runner
            dockerfile: services/agent-runner/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ matrix.repository }}:${{ needs.release-please.outputs.tag_name || github.sha }}
            ${{ matrix.repository }}:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
            github_actor=${{ github.actor }}
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GIT_SHA=${{ needs.release-please.outputs.tag_name || github.sha }}

  native-android:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install app dependencies
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --no-frozen-lockfile
      - name: Build web app
        run: pnpm --filter @extratoast/agents-ui build
      - name: Add Android project
        working-directory: services/agents-ui
        run: npx cap add android
      - name: Sync Android project
        working-directory: services/agents-ui
        run: npx cap sync android
      - name: Build Android release bundle
        working-directory: services/agents-ui/android
        run: ./gradlew bundleRelease
      - name: Assemble installable debug APK
        working-directory: services/agents-ui/android
        run: ./gradlew assembleDebug
      - name: Check Android signing secrets
        id: android-signing
        run: echo "has_keystore=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"
      - name: Decode Android keystore
        if: ${{ steps.android-signing.outputs.has_keystore == 'true' }}
        id: android-keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/agents-ui-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
      - name: Sign Android release bundle
        if: ${{ steps.android-signing.outputs.has_keystore == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.android-keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          aab_path="services/agents-ui/android/app/build/outputs/bundle/release/app-release.aab"
          key_password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$key_password" "$aab_path" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$aab_path"
      - name: Upload Android release bundle artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agents-ui-android-release-bundle
          path: services/agents-ui/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
      - name: Upload installable debug APK artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agents-app-android-apk
          path: services/agents-ui/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Attach installable APK to release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" services/agents-ui/android/app/build/outputs/apk/debug/app-debug.apk --clobber
      - name: Check Google Play credentials
        id: google-play
        run: echo "has_credentials=${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload Android release bundle to Google Play internal track
        if: ${{ steps.google-play.outputs.has_credentials == 'true' && steps.android-signing.outputs.has_keystore == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.extratoast.agents
          releaseFiles: services/agents-ui/android/app/build/outputs/bundle/release/app-release.aab
          track: internal

  native-ios:
    needs: release-please
    if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install app dependencies
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          pnpm install --no-frozen-lockfile
      - name: Build web app
        run: pnpm --filter @extratoast/agents-ui build
      - name: Add iOS project
        working-directory: services/agents-ui
        run: npx cap add ios
      - name: Sync iOS project
        working-directory: services/agents-ui
        run: npx cap sync ios
      # Signed IPA archive + TestFlight upload require operator-provided Apple signing secrets and are intentionally not run without them.
      - name: Build iOS simulator smoke
        working-directory: services/agents-ui
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
